site_name: SGT | Sensor Grid Technology
site_description: Public technical documentation for the SGT platform
site_url: https://sgtedge.github.io/docs-pub

repo_name: SGTedge/docs-pub
repo_url: https://github.com/SGTedge/docs-pub

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Inter
    code: Roboto Mono

  extra_css:
    - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search

nav:
  - Product:
      - Overview: 01_PRODUCT/overview.md
      - System Overview: 01_PRODUCT/system-overview.md
      - Data Flow: 01_PRODUCT/data-flow.md
      - Data Model: 01_PRODUCT/data-model.md
      - Use Cases: 01_PRODUCT/use-cases.md
      - Features: 01_PRODUCT/features.md
      - Terminology: 01_PRODUCT/terminology.md

  - Hardware:
      - Overview: 02_HARDWARE/README.md
      - Server: 02_HARDWARE/server/README.md
      - Sensors:
          - Overview: 02_HARDWARE/sensors/README.md
          - Temperature: 02_HARDWARE/sensors/temperature/README.md
          - Temperature & Humidity: 02_HARDWARE/sensors/temperature-humidity/README.md
          - Current: 02_HARDWARE/sensors/current/README.md
          - Vibration: 02_HARDWARE/sensors/vibration/README.md
      - Power Supply: 02_HARDWARE/power-supply/README.md

  - Software:
      - Overview: 03_SOFTWARE/README.md
      - Web Application: 03_SOFTWARE/web-application.md
      - User Management: 03_SOFTWARE/user-management.md
      - Sensor Management: 03_SOFTWARE/sensor-management.md
      - Data Export: 03_SOFTWARE/data-export.md
      - Notifications: 03_SOFTWARE/notifications.md

  - Integration:
      - Overview: 04_INTEGRATION/README.md
      - REST API: 04_INTEGRATION/rest-api.md
      - Authentication: 04_INTEGRATION/authentication.md
      - Examples: 04_INTEGRATION/examples/README.md

  - Technical Notes:
      - Overview: 05_TECHNICAL_NOTES/README.md
      - Technical Whitepaper: 05_TECHNICAL_NOTES/technical-whitepaper.md
      - Radio Communication: 05_TECHNICAL_NOTES/radio-communication.md
      - Measurement Methodology: 05_TECHNICAL_NOTES/measurement-methodology.md
      - Edge Data Processing: 05_TECHNICAL_NOTES/edge-data-processing.md
